name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: context_port
          POSTGRES_USER: contextport
          POSTGRES_PASSWORD: contextport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextport -d context_port"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://contextport:contextport@localhost:5432/context_port
      TEST_DATABASE_URL: postgresql://contextport:contextport@localhost:5432/context_port
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: contextport_e2e
          POSTGRES_USER: contextport
          POSTGRES_PASSWORD: contextport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextport -d contextport_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://contextport:contextport@localhost:5432/contextport_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: e2e-failure-artifacts
          path: e2e-artifacts/
          retention-days: 7
