name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: context_port
          POSTGRES_USER: contextport
          POSTGRES_PASSWORD: contextport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextport -d context_port"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://contextport:contextport@localhost:5432/context_port
      TEST_DATABASE_URL: postgresql://contextport:contextport@localhost:5432/context_port
    steps:
      - name: Mark Vercel verification pending
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              context: 'Vercel - context-port: verify',
              state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Notify Vercel of verification result
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              context: 'Vercel - context-port: verify',
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: contextport_e2e
          POSTGRES_USER: contextport
          POSTGRES_PASSWORD: contextport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextport -d contextport_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://contextport:contextport@localhost:5432/contextport_e2e
    steps:
      - name: Mark Vercel E2E pending
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              context: 'Vercel - context-port: e2e',
              state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: e2e-failure-artifacts
          path: e2e-artifacts/
          retention-days: 7
      - name: Notify Vercel of E2E result
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              context: 'Vercel - context-port: e2e',
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
