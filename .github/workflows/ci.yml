name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: context_port
          POSTGRES_USER: contextport
          POSTGRES_PASSWORD: contextport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextport -d context_port"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://contextport:contextport@localhost:5432/context_port
      TEST_DATABASE_URL: postgresql://contextport:contextport@localhost:5432/context_port
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
