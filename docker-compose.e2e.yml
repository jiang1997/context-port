services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: contextport_e2e
      POSTGRES_USER: contextport
      POSTGRES_PASSWORD: contextport
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextport -d contextport_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
