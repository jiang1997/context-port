services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: context_port
      POSTGRES_USER: contextport
      POSTGRES_PASSWORD: contextport
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextport -d context_port"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - context-port-postgres:/var/lib/postgresql

volumes:
  context-port-postgres:
